<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300" role="img" aria-label="쓸모야 캐릭터 임시 이미지">
  <!-- 쓸모야 임시 캐릭터 (종이인형 스타일 플레이스홀더) -->
  <defs>
    <filter id="paper" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="6" stdDeviation="4" flood-color="#5b5040" flood-opacity="0.22"/>
    </filter>
    <pattern id="grain" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.6" fill="#000" opacity="0.03"/>
      <circle cx="4" cy="4" r="0.5" fill="#000" opacity="0.025"/>
    </pattern>
  </defs>

  <!-- 종이 오려낸 흰 테두리 -->
  <g filter="url(#paper)">
    <path fill="#FFFDF8" stroke="#E7DCCB" stroke-width="1.5" d="
      M100 18
      C128 18 146 38 146 64
      C146 82 138 96 126 104
      L150 112 C162 116 168 128 166 142
      L160 186 C158 196 148 200 140 196
      L138 206 L136 252 L150 258 C160 262 162 276 152 282
      L112 284 L104 240 L96 240 L88 284 L48 282
      C38 276 40 262 50 258 L64 252 L62 206
      L60 196 C52 200 42 196 40 186
      L34 142 C32 128 38 116 50 112
      L74 104 C62 96 54 82 54 64
      C54 38 72 18 100 18 Z"/>
  </g>

  <!-- 다리 (연청 바지) -->
  <path d="M70 196 L130 196 L128 254 L106 254 L100 214 L94 254 L72 254 Z" fill="#A9C3D8"/>
  <path d="M100 214 L100 200" stroke="#8EABC2" stroke-width="1.5"/>
  <path d="M84 222 L86 250 M116 222 L114 250" stroke="#94B1C8" stroke-width="1" opacity="0.7"/>

  <!-- 초록 운동화 -->
  <path d="M68 252 L96 252 L98 268 C98 273 94 275 90 275 L58 275 C52 275 52 266 58 263 Z" fill="#7FA37A"/>
  <path d="M104 252 L132 252 L142 263 C148 266 148 275 142 275 L110 275 C106 275 102 273 102 268 Z" fill="#7FA37A"/>
  <path d="M58 271 L98 271 M102 271 L146 271" stroke="#FFFDF8" stroke-width="2.5"/>
  <circle cx="82" cy="259" r="1.4" fill="#FFFDF8"/><circle cx="118" cy="259" r="1.4" fill="#FFFDF8"/>

  <!-- 팔 -->
  <path d="M62 120 C50 124 46 134 47 146 L50 182 C51 188 58 190 62 186" fill="#F6E3D3"/>
  <path d="M138 120 C150 124 154 134 153 146 L150 182 C149 188 142 190 138 186" fill="#F6E3D3"/>

  <!-- 목 -->
  <rect x="92" y="98" width="16" height="18" rx="4" fill="#F3DFCD"/>

  <!-- 흰 상의 -->
  <path d="M66 112 L134 112 C146 116 152 126 152 140 L148 152 L136 150 L134 200 L66 200 L64 150 L52 152 L48 140 C48 126 54 116 66 112 Z" fill="#FFFFFF" stroke="#E4DACB" stroke-width="1.5"/>
  <path d="M88 112 C92 120 108 120 112 112" fill="none" stroke="#E4DACB" stroke-width="1.5"/>

  <!-- 작은 크로스백 -->
  <path d="M74 114 L128 180" stroke="#B89A76" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="116" y="170" width="26" height="22" rx="6" fill="#C9AE8A"/>
  <path d="M116 178 L142 178" stroke="#B0946F" stroke-width="1.5"/>
  <circle cx="129" cy="182" r="1.8" fill="#FFFDF8"/>

  <!-- 얼굴 -->
  <circle cx="100" cy="66" r="38" fill="#F9E9DB"/>
  <!-- 머리카락 -->
  <path d="M62 64 C60 38 80 26 100 26 C122 26 140 38 138 64 C132 52 120 46 104 46 C96 52 82 56 62 64 Z" fill="#5E4B3C"/>
  <!-- 눈 -->
  <ellipse cx="86" cy="72" rx="3.2" ry="4" fill="#3E3A33"/>
  <ellipse cx="114" cy="72" rx="3.2" ry="4" fill="#3E3A33"/>
  <circle cx="87" cy="70.5" r="1" fill="#fff"/><circle cx="115" cy="70.5" r="1" fill="#fff"/>
  <!-- 볼터치 -->
  <ellipse cx="78" cy="83" rx="6" ry="3.5" fill="#F2B8A6" opacity="0.6"/>
  <ellipse cx="122" cy="83" rx="6" ry="3.5" fill="#F2B8A6" opacity="0.6"/>
  <!-- 입 -->
  <path d="M94 84 C97 88 103 88 106 84" fill="none" stroke="#3E3A33" stroke-width="2" stroke-linecap="round"/>

  <rect width="200" height="300" fill="url(#grain)"/>
</svg>
